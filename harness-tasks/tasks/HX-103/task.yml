id: HX-103
refapp_version: refapp-v2
kind: bugfix
prompt: prompt.md
touches: [Leasing, Core]
coupling: [commit-behavior, events]
source: refapp
attachments: []
scorers: [build, pass_to_pass, fail_to_pass]
pass_to_pass:
  - { codeunit: 80030, procedures: [LeaseRateUsesCoreInternal] }
  - { codeunit: 80056, procedures: [InvoicesLinesDueUpToDate, HandledLinesAreNotInserted, AfterEventSeesEveryCreatedLine] }
fail_to_pass:
  depends_on: [Core, Leasing, Integration]
  tests:
    - { codeunit: 87505, procedures: [AcceptedProposalApplied, DeclinedProposalKeepsNoLetter, MixedLeasesReviewedOnTheirOwn, CommittingAdvisorDeclinedKeepsNothing, CommittingAdvisorAcceptedKeepsLetter, FailingAdvisorDoesNotStopReview, EqualRateCounts] }
mutants: []
contamination: null
limits: { timeout_min: 30 }
