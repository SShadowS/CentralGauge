id: HX-090
refapp_version: refapp-v2-rc1
kind: test-authoring
prompt: prompt.md
touches: [Leasing, Core, Test]
coupling: [commit-behavior, events]
source: refapp
attachments: []
scorers: [build, pass_to_pass, mutant_kill]
pass_to_pass:
