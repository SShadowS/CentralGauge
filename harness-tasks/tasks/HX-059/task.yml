id: HX-059
refapp_version: refapp-v2-rc1
kind: bugfix
prompt: prompt.md
touches: [Fleet, Rental, Core]
coupling: [single-instance, events]
source: refapp
attachments: []
scorers: [build, pass_to_pass, fail_to_pass]
pass_to_pass:
  - { codeunit: 80020, procedures: [DamageBlocksVehicle, RepairLastDamageUnblocks] }
  - { codeunit: 80010, procedures: [CheckOutMarksVehicleCheckedOut, SuspendRentalsBlocksCheckout] }
fail_to_pass:
  depends_on: [Core, Fleet]
  tests:
    - { codeunit: 86640, procedures: [BatchRepairsAndReleases, VehiclesHeldDuringBatch, FailedBatchReleasesHold, RefusedRepairKeepsNothingAndReleases, NextBatchAfterFailure, OtherVehiclesAsToday, EmptyBatch, AlreadyRepairedEntryInBatch] }
mutants: []
contamination: null
limits: { timeout_min: 30 }
