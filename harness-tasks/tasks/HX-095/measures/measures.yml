# Values derived by reasoning, not yet measured on a container (gate before trusting them).
# Every scenario fails on the shipped baseline: S1-S3, S8 and S9 by the TestField error in the
# apply handler, S4-S7 because UpdateAmount and Rebuild recalculate the locked line (100/80
# becomes 130/81.25), so all nine rows are weighted.
# skip-locked-lines leaves the locked lines' Applies-to ID behind: loses S1, S2, S3, S8.
# restore-in-memory stores the recalculated amounts: loses S1, S2, S3, S8, S9.
# handler-only leaves UpdateAmount and Rebuild unguarded: loses S4, S5, S6, S7.
# lcy-from-rate stores Amount (LCY) = 100 / current rate on every locked line: loses S1-S9.
# rebuild-unguarded: loses S6, S7.
# sent-only recalculates Exported lines: loses S2, S4, S7.
# only-on-id-change skips the same-ID reapplication, so the Open line stays 130 / 81.25: loses S9.
