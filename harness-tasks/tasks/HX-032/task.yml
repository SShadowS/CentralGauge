id: HX-032
refapp_version: refapp-v2
kind: feature
prompt: prompt.md
touches: [Integration, Core]
coupling: [events, commit-behavior]
source: refapp
attachments: []
scorers: [build, pass_to_pass, fail_to_pass]
pass_to_pass:
  - { codeunit: 80057, procedures: [DeliveredEntryIsSent, RejectedEntryKeepsItsError, EntryFailsAtMaxAttempts, UndeliveredWithoutTransport] }
  - { codeunit: 80040, procedures: [PayloadCarriesVehicleNo, OutboxQueuesCheckout] }
fail_to_pass:
  depends_on: [Core, Fleet, Integration]
  tests:
    - { codeunit: 86100, procedures: [WritingTransportDelivers, FailedSendKeepsNoReceipt, UndeliveredSendKeepsNoReceipt, PendingDispatchMixedTransports, WritingTransportFailsAtMaxAttempts, TransportGetsTheDispatchedEntry, NonWritingTransportUnchanged] }
mutants: []
contamination: null
limits: { timeout_min: 30 }
