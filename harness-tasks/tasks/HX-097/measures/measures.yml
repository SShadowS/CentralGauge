# keep-early-exit: no event when both flags are off: loses S1.
# event-twice: event raised inside AddSharedApprovals past its flag check too: loses S2-S7, S9.
# fresh-record: the caller's Table ID filter is lost, the 70202 rows leak: loses S3, S7.
# reset-passed-record: caller filter and Open filter both lost: loses S3, S4, S7.
# out-of-office-dropped: loses S5.
# flags-outside-only: AddSharedApprovals shares every type with no flag check: loses S5 (the
# Colleague row leaks while only out-of-office is on) and S8 (direct call with both flags off).
