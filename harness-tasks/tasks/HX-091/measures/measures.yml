# Every scenario is weighted (C-15): each states a requirement of the ticket, so a wrong fix that
# breaks one of them cannot take full credit. The baseline passes S4 S6 S8 S9, so it scores 4/10.
# S1-S9 reasoned from the failing rows of gate 2026-11-02T02-02-05-220Z on f8c688af (Cronus284):
# mark-without-commit and flags-on-entry lose S1 S2 S3 S5 S7; mark-before-send loses those and S8;
# mark-per-entry loses S3; mail-only loses S2; optimistic-failure loses S6;
# never-cleared loses S1 S2 S4 S8; clear-only-clean loses S1 S2 S8.
# S10 (Sol C-15 r6): the mail fails, then the export fails, then it goes through. Error Message holds
# the latest error. It is lost by the baseline (second mail), mark-without-commit (second mail),
# flags-on-entry (stale entry), mark-before-send and mark-mail-before-send (mail never retried),
# and first-error-only (keeps the first error). The other naives pass it.
# error-after-mail (Sol C-15 r1) sets Error on the entry once the mail is out, before the export:
# S6 reads the entry at every delivery step, so it loses S6 only.
# mark-mail-before-send (Sol C-15 r3) commits the mail mark before sending: loses S8, S10.
# clear-if-failed (Sol C-15 r4) clears the delivery marks only for an entry that failed before:
# a deliberate resend after a clean delivery sends nothing, so it loses S4 only.
# first-error-only (Sol C-15 r6) writes Error Message only when it is empty: loses S10 only.
