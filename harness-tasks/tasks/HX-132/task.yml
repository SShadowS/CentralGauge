id: HX-132
refapp_version: refapp-v2
kind: bugfix
prompt: prompt.md
touches: [Rental, Fleet, Core]
coupling: [events, commit-behavior]
source: refapp
attachments: []
scorers: [build, pass_to_pass, fail_to_pass]
pass_to_pass:
  - { codeunit: 80010, procedures: [CheckOutMarksVehicleCheckedOut, CheckOutTwiceFails, SwapMovesContractToFreeVehicle, SuspendRentalsBlocksCheckout] }
fail_to_pass:
  depends_on: [Core, Fleet, Rental]
  tests:
    - { codeunit: 87940, procedures: [FailedCheckOutKeepsHold, RefusedCheckOutKeepsHold, RetriedCheckOutReusesHold, CheckOutAuthorizesExpectedAmount, FailedSwapReleasesNothing, RefusedSwapReleasesNothing, RetriedSwapUsesNewHold, SwapReleasesOldHoldOnce, CheaperSwapKeepsHold, EqualRateSwapKeepsHold, RetargetedSwapRequestsNewHold, CheckOutAfterRateChangeRequestsNewHold, RetargetedSwapLeavesOneOpenHold, CheaperSwapAfterFailedSwapReleasesUnusedHold, RateChangedCheckOutReleasesReplacedHold] }
mutants: []
contamination: null
limits: { timeout_min: 30 }
