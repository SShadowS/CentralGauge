# Task taxonomy, schema version 2. Authoritative for the SITE only.
# NOT part of the task_set hash: editing this file and re-syncing never
# invalidates a benchmark. Generated by the refresh-task-taxonomy pipeline;
# facets come from pipeline/enriched-tags.json and tag definitions from
# pipeline/facet-definitions.ts. Hand-edit only the overrides here.
schema_version: 2

groups:
  - slug: build-from-spec
    name: "Build from spec"
    description: "Write new AL objects from a behavioural specification."
  - slug: diagnose-composite
    name: "Composite diagnose"
    description: "Repair one application assembled from several donor applications with every defect live and no per-module symptom."
  - slug: diagnose-single
    name: "Single-defect diagnose"
    description: "Repair a complete application with one planted defect, given a symptom."
  - slug: runtime-trap
    name: "Runtime trap"
    description: "Implement a compact requirement whose natural solution meets a Business Central runtime semantic."

families:
  - slug: environment
    name: "Environment"
    description: "Execution requirements: company scope, culture, permissions."
  - slug: invariant
    name: "Invariant"
    description: "A domain contract the oracle grades independent of mechanism."
  - slug: mechanism
    name: "Mechanism"
    description: "A Business Central runtime or language semantic the task turns on."
  - slug: surface
    name: "AL surface"
    description: "AL objects and APIs the task touches."

tags:
  - slug: base64
    family: surface
    name: "Base64"
    description: "A base64 is created, extended or exercised."
  - slug: bounded-sql-cost
    family: invariant
    name: "Bounded SQL Cost"
    description: "The number of database round trips stays bounded and does not grow with the number of rows involved."
  - slug: business-event
    family: surface
    name: "Business Event"
    description: "A business event is created, extended or exercised."
  - slug: codeunit
    family: surface
    name: "Codeunit"
    description: "A codeunit is created, extended or exercised."
    hidden_by_default: true
  - slug: collectible-errors
    family: surface
    name: "Collectible Errors"
    description: "A collectible errors is created, extended or exercised."
  - slug: commit-scope
    family: mechanism
    name: "Commit Scope"
    description: "Where a Commit falls decides which writes are already durable when a later error rolls the surrounding transaction back."
  - slug: company-isolation
    family: invariant
    name: "Company Isolation"
    description: "Each company's data stays its own: a read or a write in one company never shows up in another."
  - slug: company-scope
    family: mechanism
    name: "Company Scope"
    description: "Which company's rows a record variable reads follows from the current company, from ChangeCompany and from whether the table is per-company at all."
  - slug: culture-format-roundtrip
    family: mechanism
    name: "Culture Format Roundtrip"
    description: "Formatting or parsing under the session's culture produces different text than the culture-invariant form an external system expects."
  - slug: datatransfer
    family: surface
    name: "DataTransfer"
    description: "A datatransfer is created, extended or exercised."
  - slug: decimal-precision
    family: mechanism
    name: "Decimal Precision"
    description: "Where a decimal is rounded, in which direction and to which precision changes the value that ends up stored."
  - slug: enum
    family: surface
    name: "Enum"
    description: "A enum is created, extended or exercised."
  - slug: enum-extension
    family: surface
    name: "Enum Extension"
    description: "A enum extension is created, extended or exercised."
  - slug: error-flow
    family: mechanism
    name: "Error Flow"
    description: "Whether an error is raised, caught, turned into a return value or swallowed decides what the caller sees and what remains written."
  - slug: error-info
    family: surface
    name: "Error Info"
    description: "A error info is created, extended or exercised."
  - slug: event-binding
    family: mechanism
    name: "Event Binding"
    description: "Whether a subscriber is bound at all, and through which codeunit instance, decides whether it observes the event."
  - slug: event-order
    family: mechanism
    name: "Event Order"
    description: "Subscribers and their publisher share a record or parameter, so which one runs first, and what it writes, decides the result."
  - slug: event-publisher
    family: surface
    name: "Event Publisher"
    description: "A event publisher is created, extended or exercised."
  - slug: event-subscriber
    family: surface
    name: "Event Subscriber"
    description: "A event subscriber is created, extended or exercised."
  - slug: exact-total
    family: invariant
    name: "Exact Total"
    description: "The figure produced has to equal the specified value exactly, not approximately and not on average."
  - slug: factbox
    family: surface
    name: "Factbox"
    description: "A factbox is created, extended or exercised."
  - slug: fieldref
    family: surface
    name: "FieldRef"
    description: "A fieldref is created, extended or exercised."
  - slug: filter-group-state
    family: mechanism
    name: "Filter Group State"
    description: "Filters live in numbered filter groups, so a filter set in one group intersects with, rather than replaces, the filters set in another."
  - slug: filter-key-semantics
    family: mechanism
    name: "Filter Key Semantics"
    description: "Filters, the current key and the sort order decide which rows a call sees and in which order it sees them."
  - slug: flowfield
    family: surface
    name: "FlowField"
    description: "A flowfield is created, extended or exercised."
  - slug: flowfield-sift
    family: mechanism
    name: "FlowField SIFT"
    description: "A FlowField holds no value until it is calculated, and what it then holds depends on the filters in force at that moment."
  - slug: flowfilter
    family: surface
    name: "FlowFilter"
    description: "A flowfilter is created, extended or exercised."
  - slug: guid
    family: surface
    name: "GUID"
    description: "A guid is created, extended or exercised."
  - slug: http
    family: surface
    name: "HTTP"
    description: "A http is created, extended or exercised."
  - slug: idempotent-rebuild
    family: invariant
    name: "Idempotent Rebuild"
    description: "Running the operation again over the same input reproduces the same result instead of duplicating or compounding it."
  - slug: inclusive-boundary
    family: invariant
    name: "Inclusive Boundary"
    description: "A threshold, interval endpoint or capacity limit counts as inside or outside exactly as specified, with no off-by-one."
  - slug: install
    family: surface
    name: "Install"
    description: "A install is created, extended or exercised."
  - slug: interface
    family: surface
    name: "Interface"
    description: "A interface is created, extended or exercised."
  - slug: json
    family: surface
    name: "JSON"
    description: "A json is created, extended or exercised."
  - slug: keys
    family: surface
    name: "Keys"
    description: "A keys is created, extended or exercised."
    hidden_by_default: true
  - slug: largest-remainder-allocation
    family: invariant
    name: "Largest Remainder Allocation"
    description: "An amount split in proportion to weights is paid out in whole units, with each leftover unit going to whichever share was rounded down by the most."
  - slug: multi-company
    family: environment
    name: "Multi Company"
    description: "The task needs more than one company on the database to exercise its behaviour."
  - slug: page
    family: surface
    name: "Page"
    description: "A page is created, extended or exercised."
    hidden_by_default: true
  - slug: page-action
    family: surface
    name: "Page Action"
    description: "A page action is created, extended or exercised."
  - slug: page-customization
    family: surface
    name: "Page Customization"
    description: "A page customization is created, extended or exercised."
  - slug: page-extension
    family: surface
    name: "Page Extension"
    description: "A page extension is created, extended or exercised."
  - slug: permission-check
    family: mechanism
    name: "Permission Check"
    description: "A permission set grant, or a read or write permission probe, decides whether an operation may touch a table."
  - slug: permissionset
    family: surface
    name: "PermissionSet"
    description: "A permissionset is created, extended or exercised."
  - slug: query
    family: surface
    name: "Query"
    description: "A query is created, extended or exercised."
  - slug: record-locking-concurrency
    family: mechanism
    name: "Record Locking Concurrency"
    description: "A record already read into a variable can go stale, so a later write can silently discard what another call or session has stored in the meantime."
  - slug: recordref
    family: surface
    name: "RecordRef"
    description: "A recordref is created, extended or exercised."
  - slug: recordref-reflection
    family: mechanism
    name: "RecordRef Reflection"
    description: "Reading or writing through RecordRef, FieldRef or object metadata resolves fields at run time instead of at compile time."
  - slug: report
    family: surface
    name: "Report"
    description: "A report is created, extended or exercised."
  - slug: reversal-conservation
    family: invariant
    name: "Reversal Conservation"
    description: "A reversal, transfer or compensating write leaves the totals it was meant to preserve exactly as they were."
  - slug: roundtrip-fidelity
    family: invariant
    name: "Roundtrip Fidelity"
    description: "A value carried through a copy, an encode and decode, or a store and read comes back exactly as it went in."
  - slug: secrettext
    family: surface
    name: "SecretText"
    description: "A secrettext is created, extended or exercised."
  - slug: serialization-encoding
    family: mechanism
    name: "Serialization Encoding"
    description: "Reading or writing an external representation, such as JSON, XML, a stream or a delimited string, has to follow that format's own rules."
  - slug: sift-keys
    family: surface
    name: "SIFT Keys"
    description: "A sift keys is created, extended or exercised."
  - slug: single-instance
    family: surface
    name: "Single Instance"
    description: "A single instance is created, extended or exercised."
  - slug: single-instance-state
    family: mechanism
    name: "Single Instance State"
    description: "State kept in a SingleInstance codeunit is shared by every variable of that codeunit for the whole session, and survives until something invalidates it."
  - slug: sql-cost-scaling
    family: mechanism
    name: "SQL Cost Scaling"
    description: "How the work is expressed decides whether its database cost grows with the volume of data or stays flat."
  - slug: string-formatting
    family: surface
    name: "String Formatting"
    description: "A string formatting is created, extended or exercised."
  - slug: system-part
    family: surface
    name: "System Part"
    description: "A system part is created, extended or exercised."
  - slug: table
    family: surface
    name: "Table"
    description: "A table is created, extended or exercised."
    hidden_by_default: true
  - slug: table-extension
    family: surface
    name: "Table Extension"
    description: "A table extension is created, extended or exercised."
  - slug: table-relation
    family: surface
    name: "Table Relation"
    description: "A table relation is created, extended or exercised."
  - slug: temporary-record
    family: mechanism
    name: "Temporary Record"
    description: "A temporary record variable holds its rows in memory with its own contents, filters and trigger behaviour, separate from the real table."
  - slug: temporary-table
    family: surface
    name: "Temporary Table"
    description: "A temporary table is created, extended or exercised."
  - slug: test-codeunit
    family: surface
    name: "Test Codeunit"
    description: "A test codeunit is created, extended or exercised."
  - slug: test-page
    family: surface
    name: "Test Page"
    description: "A test page is created, extended or exercised."
  - slug: test-permissions
    family: environment
    name: "Test Permissions"
    description: "The task has to run under a restricted permission set rather than as a full-rights user."
  - slug: text-builder
    family: surface
    name: "Text Builder"
    description: "A text builder is created, extended or exercised."
  - slug: tryfunction-write-rollback
    family: mechanism
    name: "TryFunction Write Rollback"
    description: "A TryFunction that catches an error also rolls back every database write made inside it, so a write that must survive the failure has to happen outside it."
  - slug: upgrade-datatransfer
    family: mechanism
    name: "Upgrade DataTransfer"
    description: "Install and upgrade code, upgrade tags and DataTransfer move existing data when an extension's schema changes."
  - slug: upgrade-tag
    family: surface
    name: "Upgrade Tag"
    description: "A upgrade tag is created, extended or exercised."
  - slug: validation-trigger
    family: mechanism
    name: "Validation Trigger"
    description: "Table triggers, field validation and table-relation declarations make the platform run logic of its own, so what it computes or cascades on insert, modify, rename or validate is part of the answer."
  - slug: variant
    family: surface
    name: "Variant"
    description: "A variant is created, extended or exercised."
  - slug: web-service
    family: surface
    name: "Web Service"
    description: "A web service is created, extended or exercised."
  - slug: xml
    family: surface
    name: "XML"
    description: "A xml is created, extended or exercised."
  - slug: xrec-trigger-state
    family: mechanism
    name: "xRec Trigger State"
    description: "Inside a table trigger, xRec carries the row's previous values, so a change can be measured against what was stored before it."

aliases:
  - { from: api-page, to: page }
  - { from: calcformula, to: flowfield }
  - { from: codeunits, to: codeunit }
  - { from: customization, to: page-customization }
