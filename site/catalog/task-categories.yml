  - { from: pagecustomization, to: page-customization }
  - { from: pageextension, to: page-extension }
  - { from: pages, to: page }
  - { from: queries, to: query }
  - { from: query-object, to: query }
  - { from: reflection, to: recordref }
  - { from: reports, to: report }
  - { from: sift, to: sift-keys }
  - { from: singleinstance, to: single-instance }
  - { from: systempart, to: system-part }
  - { from: table-relations, to: table-relation }
  - { from: tableextension, to: table-extension }
  - { from: tables, to: table }
  - { from: web-services, to: web-service }
  - { from: xmlport, to: xml }
  - { from: xmlports, to: xml }

