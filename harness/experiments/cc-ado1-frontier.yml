# one attempt per task on HX-091..HX-097 only; no other HX task may run here.
id: cc-ado1-frontier
hypothesis: "Exploratory: how hard ADO batch 1 (HX-091..HX-097) is for plain Claude Code on Sonnet 5 and Opus 5.5."
primary_metric: pass_rate
baseline: cc-v2-tue-plain
variants: [cc-ado1-opus-plain]
