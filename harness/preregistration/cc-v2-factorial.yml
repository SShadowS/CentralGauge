# Stage A pre-registration of cc-v2-factorial (M11-16; PreregSchema in src/harness/prereg.ts).
# Frozen before screening; stage B (M11-17) fills only the stage-B keys.
v: 1
experiment: cc-v2-factorial
protocol:
  arms: [cc-v2-plain, cc-v2-plain-lsp, cc-v2-realistic, cc-v2-realistic-lsp]
  contrasts:
    - { id: C1, name: "LSP effect without the realistic setup", baseline: cc-v2-plain, variant: cc-v2-plain-lsp }
    - { id: C2, name: "LSP effect with the realistic setup", baseline: cc-v2-realistic, variant: cc-v2-realistic-lsp }
    - { id: C3, name: "realistic effect without LSP", baseline: cc-v2-plain, variant: cc-v2-realistic }
  interaction: { name: "LSP effect differs by realistic level", status: exploratory, plain: cc-v2-plain, lsp: cc-v2-plain-lsp, realistic: cc-v2-realistic, realistic_lsp: cc-v2-realistic-lsp }
approval: "PENDING-OWNER: replace with the owner's OWNER-APPROVED: <words> (<ISO-8601 time>) line"
population: "Frozen v2 task set: BC/AL tasks of the stated kinds and coupling styles on refapp-v2, selected by the screening pilot."
primary_metric: cost_per_solved_task
confirmatory: true
family: [C1, C2, C3]
alpha: 0.05
test: { sides: two, p_value: percentile_bootstrap_plus_one, adjustment: holm, direction: sign_of_delta }
intervals: { reported: per_contrast_unadjusted, beside: bonferroni_same_draws }
bootstrap: { unit: task, resamples: 10000, seed: 20261021, level: 0.95 }
zero_solve: { rule: suppress_any_undefined }
missing_pairs: per_contrast_matched
held_out:
  count: 4
  rule: "M8 pickHeldOut at harness-v2-screen-start: first-ranked set per kind with 2 large tasks and every required coupling style"
  seal: harness-v2-screen-start
  tasks: [HX-010, HX-030, HX-037, HX-039]
  in_family: false
measures:
  fingerprint: "401dea01c02509e2446ac5152db4add7d2aa29d868b38f67fd4c41de3a741a34"
  unknown_symbol_codes: [AL0118, AL0132, AL0185]
  ruleset_sha256: "1ac13153d7fce1e7080bc406376403be4048b0b785804149ef4542b98a4b5c0a"
  canary_codes: [AA0137, AA0194, AA0215, AA0218, AA0225, AW0002]
  workflow_execution: used_execution
  effort_execution: every_attempt
exploratory_metrics:
  - tokens_in_uncached
  - tokens_cache_read
  - tokens_cache_write
  - tokens_out
  - tokens_reasoning
  - turns
  - wall_ms
  - backend_builds
  - test_runs
  - burden_distinct
  - burden_unknown_symbol
  - first_build_ok
  - final_errors
  - final_new_warnings
  - reuse
  - reuse_executed
  - partial_credit
  - hidden_regressions_preserved
  - pass_to_pass_preserved
  - lsp_calls
  - lsp_shell_calls
  - lsp_passive_diagnostics
  - search_calls
  - read_calls
  - edit_calls
  - skill_invocations
  - subagents
  - mcp_calls
  - pass_rate
  - pass_k
simulation:
  script_sha256: "d26a22f43b52761cc5354cbf5cf848b2399b65fad4d6f3820cc497f86a4f97e2"
  args: { sims: 1000, resamples: 1000, confirm_sims: 600, confirm_resamples: 10000, seed: 20261003, pool_factor: 3, rule_b_share: 0.99, effect: 0.3, power_gate: fitted }
design_rule: >-
  Smallest tasks x repeats meeting the fitted power, error-control, suppression and coverage gates
  under the frozen rule (M11-13 chooseDesign), confirmed at 10000 resamples; stage-A simulation
  chose 40 tasks x 8 repeats (N_prelim 40, R 8). `unscreenable` candidates (incomplete after the
  one rescreen) are dropped as missing (owner-approved missingness rule). `lsp_shell_calls` is
  reported per arm as exploratory; no cell is excluded or re-run because of it.
stage_a: null
experiment_hash: null
selection: null
design: null
power_simulation: null
compiler_identity: null
stage_b_approval: null
amendments: []
