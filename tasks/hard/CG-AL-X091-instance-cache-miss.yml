id: CG-AL-X091
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application manages dispatch configuration in a single-row setup table, "CG X091 Setup". Codeunit "CG X091 Setup Mgt" exposes GetSetup and Invalidate, and is meant to read the row from the database at most once and then serve every later GetSetup call from memory, until something calls Invalidate. Testing shows the caching works fine as long as the same variable of the codeunit keeps being reused, but the moment a different part of the application declares its own, separate variable of the same codeunit and calls GetSetup on it, that call goes back to the database instead of reusing what was already read elsewhere. Fix the application so every GetSetup call, through any variable of the codeunit, is served from one shared cached copy.'
domains:
  - codeunits
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: performance-diagnosis
  tags:
    - diagnose
    - setup-table
    - caching
    - sql-budget
    - session-scope
  difficulty: hard
  cohort: reasoning-100
  origin: hand-authored
expected:
  compile: true
  testApp: tests/al/hard/CG-AL-X091.Test.al
  testCodeunitId: 89088
