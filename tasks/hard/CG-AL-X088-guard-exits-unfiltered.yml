id: CG-AL-X088
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application tracks search rules that must be completed before a search can run. Codeunit "CG X088 Search Rule Mgt" exposes HasIncompleteRules, which the Search Rules page consults to decide whether to warn the user that rules still need attention. Users report the warning shows on every page open, even after every rule has been marked complete. Turning off "Advanced Filtering Enabled" in the Search Setup is supposed to stop this automatic warning entirely, but instead makes it show even more often - it now appears whenever any search rule exists at all, complete or not. Fix the application so HasIncompleteRules reflects whether a genuinely incomplete rule exists, and never reports one while advanced filtering is turned off or while the Search Setup has not yet been configured.'
domains:
  - codeunits
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: business-logic
  tags:
