description: |-
  Create codeunit "CG X059 Gate" (ID 71460) with Access = Internal and:

      procedure RequireDraft(var Order: Record "CG X059 Order")

  The table "CG X059 Order" (ID 69003, fields "No." (Code[20], primary key) and Status (Enum "CG X059 Status")) and the enum "CG X059 Status" (ID 69002, values Draft, Released and Closed) already exist.
  RequireDraft must return normally when the order's Status is Draft, and must raise an error when it is anything else. Use the platform's standard field-check error for this, so the message names the Status field and the value it required.
