id: CG-AL-X090
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application logs financial adjustments in table "CG X090 Adjustment", each row pointing back at the case it belongs to in table "CG X090 Case" by "Case No.". Codeunit "CG X090 Totals Report" exposes TotalsByTeam, which returns the sum of adjustment amounts for every case whose "Assigned Team" matches a given filter, one total per team. The report used to return almost instantly; now that the case list has grown into the hundreds it takes noticeably longer, and the slowdown tracks the number of matching cases rather than how many adjustments actually exist. Fix the application so the report''s cost no longer grows with the number of matching cases, while still returning exactly the same totals for every team.'
domains:
  - tables
  - codeunits
  - performance
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: performance-diagnosis
  tags:
    - diagnose
    - performance
    - n-plus-one
    - query-join
    - sql-counters
  difficulty: hard
  cohort: reasoning-100
  origin: hand-authored
expected:
  compile: true
  testApp: tests/al/hard/CG-AL-X090.Test.al
  testCodeunitId: 89087
