id: CG-AL-X085
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application manages batch headers that can be reissued from a configured template. Codeunit "CG X085 Batch Reissue Mgt" exposes Reissue(BatchNo: Code[20]), which is meant to replace the existing "CG X085 Batch Header" row for that batch number with a freshly built one: the new header copies its Description and Template Code from the "CG X085 Reissue Setup" record, stamps today''s date as its Created Date, and is always left Open. The Reissue Setup record must have a Default Batch Template configured before a reissue can succeed; when the setup record does not exist yet, Reissue must fail, and when it exists but its Default Batch Template is blank, Reissue must fail with the standard field-guard error for the missing template. Either way, the batch header for that number must be left exactly as it was before the call - the same Description, Template Code, Created Date and status it had going in. Users report that a reissue which fails this way instead leaves the batch with no header at all: the old one is gone, no replacement was built in its place, and even retrying later brings nothing back until the setup is actually fixed. Reissuing a batch number that currently has no header must still build one from the template, and reissuing one batch must never affect any other batch''s header.'
domains:
  - codeunits
  - tables
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: error-transactions
  tags:
    - diagnose
    - commit-placement
    - transaction-boundary
    - partial-write
    - error-recovery
  difficulty: hard
  cohort: reasoning-100
  origin: hand-authored
expected:
  compile: true
  testApp: tests/al/hard/CG-AL-X085.Test.al
  testCodeunitId: 88838
