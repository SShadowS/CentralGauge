id: CG-AL-X092
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'An extension exchanges documents with an external service through codeunit "CG X092 Wire Format". Its ToWireDate, FromWireDecimal, and FromWireDate procedures already produce and accept the same text on every server, whatever that server''s regional settings; ToWireDecimal does not. On a server whose regional settings differ from the wire format, ToWireDecimal can write a different decimal character or extra separator characters into the amount, and wire text it wrote on one server can then fail to parse back into the original value through FromWireDecimal. Fix ToWireDecimal so it writes the same wire text on every server: a leading "-" for negative values, plain digits, and a single "." before any fractional part, with no separator marking the thousands.'
domains:
  - codeunits
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: integration-serialization
  tags:
    - diagnose
    - wire-format
    - locale
    - round-trip
  difficulty: hard
  cohort: reasoning-100
  origin: hand-authored
expected:
