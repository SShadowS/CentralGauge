id: CG-AL-X117
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application exports a sales order to XML for a warehouse partner''s integration. Codeunit "CG X117 Order Xml Export" builds a <SalesOrder> document from an order''s fields and lines. The partner''s system has started filing several exported orders under the wrong calendar day, even though Business Central shows the correct date on the order. Every date the document carries must identify the calendar day as an ISO year-month-day value the partner reads the same way on any server. Fix the application so the exported document meets that requirement.'
domains:
  - codeunits
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: integration-serialization
  tags:
    - diagnose
    - xml
    - xmldocument
    - date-formatting
    - locale
  difficulty: hard
  cohort: reasoning-100
  origin: hand-authored
expected:
  compile: true
  testApp: tests/al/hard/CG-AL-X117.Test.al
  testCodeunitId: 89311
