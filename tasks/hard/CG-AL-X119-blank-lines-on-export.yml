id: CG-AL-X119
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'Table "CG X119 Doc Line" holds a document''s lines - each one is an Item, a G/L Account, a Resource, or a Charge. Codeunit "CG X119 Exporter" builds one export line per document line via BuildExportLines, filling in the export line''s Name, Seller ID, and Unit of Measure Code from the matching master record. On every document that has a Charge line, that line''s export row comes back with a blank Name, a blank Seller ID, and a blank Unit of Measure Code, while every other line on the same document exports correctly. Fix the application so a document''s Charge lines export completely.'
domains:
