id: CG-AL-X094
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application resolves reference codes for documents. Codeunit "CG X094 Reference Engine" exposes ResolveReference(Category, SourceNo, PeriodNo), which combines a resolved reference body with a mandatory fiscal-period segment that every reference must carry, whichever category it belongs to. Codeunit "CG X094 Custom Rule" supplies a custom reference body for category CUSTOM; every other category uses the engine''s own default body. Users report that references produced for category CUSTOM are missing their fiscal-period segment, while references for every other category carry it correctly. Fix the application so every reference carries its fiscal-period segment.'
domains:
  - codeunits
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
