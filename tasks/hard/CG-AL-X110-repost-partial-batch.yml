id: CG-AL-X110
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application posts miniature journal batches to a ledger. Table "CG X110 Journal Line" holds batch lines that carry a Status of Open or Posted; codeunit "CG X110 Post Batch" implements PostBatch(BatchName: Code[10]), which posts every currently open line of the named batch into table "CG X110 Ledger Entry" and marks each of those lines Posted. Users report that when PostBatch is called again on a batch that already has some posted lines alongside newly added open ones, the previously posted lines show up a second time in the ledger as duplicate entries. Fix the application so PostBatch only ever creates ledger entries for a batch''s currently open lines, no matter how many times it has already been called against that batch.'
domains:
  - codeunits
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: error-transactions
  tags:
    - diagnose
    - posting
    - rerun
    - var-record
  difficulty: hard
  cohort: reasoning-100
  origin: hand-authored
expected:
  compile: true
  testApp: tests/al/hard/CG-AL-X110.Test.al
  testCodeunitId: 89304
