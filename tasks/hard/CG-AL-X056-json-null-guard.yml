max_attempts: 2
description: |-
  Create codeunit "CG X056 Reader" (ID 71430) with Access = Internal and:

      procedure ReadText(Source: JsonObject; PropertyName: Text): Text

  ReadText returns the text of the property named PropertyName. It returns an empty string, without raising an error, whenever that text cannot be produced: when Source has no such property, when the property holds a JSON object or a JSON array, and when the property is present but holds JSON null.
