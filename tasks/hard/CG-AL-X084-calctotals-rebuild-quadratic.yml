id: CG-AL-X084
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'Codeunit "CG X084 Total Mgt" tracks which ledger entries have been applied in the current session and keeps a "CG X084 Total Buffer" row per applied entry showing that entry''s own remaining amount. Entering entries one at a time gets progressively slower the further into a session the user is - the first few entries feel instant, but by the time a hundred or more have been added, each new one visibly hangs before the running total updates. A session that adds a large batch of entries in one go can take minutes where a handful takes a fraction of a second, even though every entry carries the same amount of data. Removing an already-applied entry and re-adding it does not fix the slowdown; it reappears and keeps compounding as more entries are added. No error ever appears - it is purely a growing wait. Fix the application so adding one more entry to the session costs no more work than adding one to a session that only just started, however many entries have already been added.'
domains:
  - codeunits
  - tables
  - performance
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
