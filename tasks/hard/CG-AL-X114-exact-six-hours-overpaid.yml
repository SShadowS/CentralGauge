id: CG-AL-X114
prompt_template: diagnose.md
fix_template: bugfix.md
max_attempts: 2
description: 'The application tracks employee travel claims in codeunit "CG X114 Allowance Calc". Its CalculateAllowance procedure derives a travel allowance amount from a claim''s away-time in minutes, and RecalculateClaim stores that amount back onto the claim. A separate away-time statistics report classifies every claim into the same three bands (no allowance, a partial allowance, and the full allowance) using the codeunit''s OvertimeBandOf procedure. Payroll has found that for some away-times, the amount RecalculateClaim pays out does not match the band OvertimeBandOf reports for the very same claim. One away-time is already confirmed correct: a 720-minute trip resolves to the full allowance of 500 under both procedures today. Fix CalculateAllowance so it agrees with OvertimeBandOf for every away-time, not only the one confirmed here.'
domains:
  - codeunits
metrics:
  - compile_pass
  - tests_pass
  - pass_attempt
metadata:
  category: business-logic
  tags:
    - diagnose
    - boundary-condition
    - cross-procedure-consistency
    - code-as-spec
  difficulty: hard
  cohort: reasoning-100
  origin: hand-authored
expected:
  compile: true
  testApp: tests/al/hard/CG-AL-X114.Test.al
  testCodeunitId: 89308
