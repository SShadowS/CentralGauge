description: 'This application is a back-office suite: it imports legacy amounts, archives documents, composes bank remittance lines, keeps journal entries balanced, and reports cost-centre figures period by period. Codeunit "CG X076 Legacy Importer" exposes ParseAmount, TryParseAmount and ImportLine; codeunit "CG X076 Import Job"''s ImportBatch calls ImportLine once per line and returns how many were imported. A well-formed, non-negative amount text produces one "CG X076 Legacy Amount" row for its entry code and counts as imported; a badly-formed or negative one reports failure and leaves no row behind. Codeunit "CG X106 Archive Mgt"''s ArchiveDocument leaves the named "CG X106 Document" carrying an "Enrichment Note" reading NOTE- followed by its "Base Total", and an "Archive Tag" of PRIORITY when that total is 100 or more and STANDARD below 100. RefreshArchiveTag sets that same "Archive Tag" and leaves the "Enrichment Note" untouched. Codeunit "CG X116 Remittance Composer" builds one payment''s remittance line. AddInvoice records an entry as the invoice number, a single space, and the amount written with exactly two decimal places, a dot as the decimal separator and nothing marking the thousands, rejecting with an error naming the 140-character limit any entry that alone would exceed it. GetRemittanceText joins the recorded entries with a comma and a space in the order they were added, returning empty text when none were added, the whole join when it is at most 140 characters, and otherwise the longest leading run of entries that still fits, closed with ", and N more" for the N invoices left out, or the bare "and N more" when not even the first entry fits. Validating "Counter Account No." on a "CG X118 Journal Line" sets that line''s "Balancing Amount" from the Amount recorded on it, so the two net to exactly zero for any account, any counter account and whatever currency sits on either side; a blank counter account leaves nothing to balance. Codeunit "CG X157 Period Statement" reports on a "CG X157 Cost Center": GetPeriodAmount returns the net amount posted between a From Date and a To Date, counting both those days, and BuildStatement writes one "CG X157 Statement Line" per calendar month that window spans, each carrying that month''s own net amount and replacing whatever rows were built for that cost centre before. Month-end review keeps turning up figures nobody can tie back to what was entered. Fix the application so every contract above holds.'
